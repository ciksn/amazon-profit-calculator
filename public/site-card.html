<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MarginGo · 单站点利润卡片</title>
  <link rel="stylesheet" href="./site-card.css?v=20260920-4">
  <link rel="stylesheet" href="./auth.css">
</head>
<body>
  <main class="site-shell">
    <section class="site-card">
      <header class="site-head">
        <label class="project-picker"><span>品类</span><select id="projectPicker" aria-label="选择品类"></select></label>
        <div class="station-label"><small>当前站点</small><b id="stationName"></b></div>
        <span class="save-state" id="saveState">已保存</span>
        <button class="copy-button" id="copyResultBtn" type="button">复制对比结果</button>
        <button class="settings-button" id="addVariantBtn" type="button">＋ 新增变体</button>
      </header>
      <div class="result-content">
        <div class="variant-grid" id="variantGrid"></div>
        <section class="record-section" id="recordSection">
          <div class="record-heading"><div><b>保存的定价方案</b><small>历史结果不会随当前售价或参数变化</small></div></div>
          <div class="record-table" id="recordTable"></div>
        </section>
      </div>
    </section>
  </main>
  <div class="settings-modal" id="parametersModal" hidden>
    <div class="settings-backdrop" data-close-parameters></div>
    <section class="settings-card" role="dialog" aria-modal="true" aria-labelledby="parametersTitle">
      <div class="settings-head"><div><b id="parametersTitle">变体参数</b><small>只用于单站卡片，各变体独立保存</small></div><button type="button" data-close-parameters aria-label="关闭">×</button></div>
      <div class="settings-toolbar"><span>请输入包装尺寸和包装重量，用于配送费计算</span><button id="readDimensionsBtn" type="button">识别剪贴板尺寸</button></div>
      <div class="input-grid" id="siteFields">
        <label class="field field-name"><span>变体名称</span><input name="variant_name" maxlength="80"></label>
        <label class="field"><span>产品成本</span><div class="input-affix"><b>¥</b><input name="cost_cny" type="number" min="0" step="0.01"></div></label>
        <label class="field"><span>包装重量</span><div class="input-pair"><input name="weight" type="number" min="0" step="0.001"><select name="weight_unit"><option value="kg">KG</option><option value="lb">LB</option></select></div></label>
        <div class="field field-size"><span>包装长 × 宽 × 高</span><div class="dimension-inputs"><input name="length" data-site-dimension type="number" min="0" step="0.01" aria-label="包装长度"><i>×</i><input name="width" data-site-dimension type="number" min="0" step="0.01" aria-label="包装宽度"><i>×</i><input name="height" data-site-dimension type="number" min="0" step="0.01" aria-label="包装高度"><select name="dimension_unit"><option value="cm">CM</option><option value="ft">FT</option></select></div></div>
      </div>
      <div class="settings-actions"><button class="danger-button" id="deleteVariantBtn" type="button">删除变体</button><span>保存后只更新当前变体</span><button type="button" id="saveVariantBtn">保存并完成</button></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./config.js"></script>
  <script src="./auth.js?v=20260904-1"></script>
  <script src="./dimensions.js"></script>
  <script src="./site-card.js?v=20260920-4"></script>
</body>
</html>
